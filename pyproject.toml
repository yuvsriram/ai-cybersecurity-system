[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cybersecurity-system"
version = "0.1.0"
description = "AI-powered cybersecurity threat detection and investigation system"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"