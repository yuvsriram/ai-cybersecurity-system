name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.13 / PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cybersec_test
          POSTGRES_USER: cybersec
          POSTGRES_PASSWORD: cybersec_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cybersec -d cybersec_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: >-
        postgresql+psycopg://cybersec:cybersec_test_password@127.0.0.1:5432/cybersec_test
      CYBERSEC_TRACING_ENABLED: "false"
      CYBERSEC_ENVIRONMENT: test
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Verify package import
        run: python -c "import cybersec; print('cybersec import OK')"

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run full test suite
        run: python -m pytest
