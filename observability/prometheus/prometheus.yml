global:

  scrape_interval: 15s

  evaluation_interval: 15s



scrape_configs:

  - job_name: cybersec-api

    metrics_path: /metrics



    authorization:

      type: Bearer

      credentials_file: /run/secrets/metrics_token



    static_configs:

      - targets:

          - api:8000



  - job_name: cybersec-worker

    metrics_path: /metrics



    static_configs:

      - targets:

          - worker:9101



  - job_name: prometheus

    static_configs:

      - targets:

          - localhost:9090